<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="index,follow">
<title>Smart Procurement PDF 2.3</title>
<style>html,body{margin:0;min-height:100%;font-family:system-ui,sans-serif}body{display:grid;place-items:center;background:#f1f5f9;color:#0f172a}main{max-width:42rem;padding:2rem;text-align:center}</style>
</head>
<body>
<main id="status">กำลังเปิดระบบ Smart Procurement PDF 2.3…</main>
<script>
(async()=>{
  try{
    const response=await fetch("./app.gz.b64",{cache:"no-store"});
    if(!response.ok) throw new Error("โหลดไฟล์ระบบไม่สำเร็จ ("+response.status+")");
    const b64=(await response.text()).trim();
    const binary=atob(b64);
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
    if(typeof DecompressionStream==="undefined") throw new Error("กรุณาเปิดด้วย Chrome หรือ Edge รุ่นปัจจุบัน");
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
    const html=await new Response(stream).text();
    document.open(); document.write(html); document.close();
  }catch(e){document.getElementById("status").textContent="เปิดระบบไม่สำเร็จ: "+(e?.message||e);}
})();
</script>
</body>
</html>
